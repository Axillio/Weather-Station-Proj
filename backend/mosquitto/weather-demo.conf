# Demo Mosquitto config for the weather station project.
#
# Linux path example:
#   sudo cp backend/mosquitto/weather-demo.conf /etc/mosquitto/conf.d/weather-demo.conf
#
# Windows Mosquitto users can copy these lines into mosquitto.conf and adjust
# password_file to the absolute Windows path of the password file.

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd

# Keep this demo simple. For production, use TLS on port 8883.
max_queued_messages 1000
persistence true
